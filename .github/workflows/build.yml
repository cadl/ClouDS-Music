name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    container:
      # Multi-platform manifest resolved from devkitarm:latest on 2026-07-17.
      image: "devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5"
    steps:
      - name: Check out complete source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Trust checked-out workspace in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install host test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zlib1g-dev

      - name: Resolve application version
        id: version
        run: echo "value=$(make --no-print-directory print-version)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches the application version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: test "${RELEASE_TAG#v}" = "$APP_VERSION"

      - name: Test, build, and package
        run: make -j2 release

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClouDS-Music-release
          path: |
            dist/ClouDS-Music.3dsx
            dist/ClouDS-Music.cia
            dist/ClouDS-Music.smdh
            dist/ClouDS-Music-${{ steps.version.outputs.value }}.zip
            dist/ClouDS-Music-${{ steps.version.outputs.value }}-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ClouDS-Music-release
          path: dist

      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/ClouDS-Music.3dsx \
            dist/ClouDS-Music.cia \
            dist/ClouDS-Music.smdh \
            "dist/ClouDS-Music-${APP_VERSION}.zip" \
            "dist/ClouDS-Music-${APP_VERSION}-source.tar.gz" \
            dist/SHA256SUMS --clobber
